name: build

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        lein: 2.12.0

    - name: Run tests
      run: lein with-profile +dev:+1.8:+1.9:+1.10:+1.11 test

    - name: Run cljs tests
      run: lein doo node test once
